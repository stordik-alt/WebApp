name: Apply multi screenshot import
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'stordik-alt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/ScreenshotImport.tsx')
          s = p.read_text()
          marker = '// MULTI_SCREENSHOT_IMPORT_V1'
          if marker in s:
              raise SystemExit(0)
          s = s.replace('import { Check, ImageUp, Loader2, Plus, Trash2, X } from "lucide-react";', 'import { Check, ImageUp, Images, Loader2, Plus, Trash2, UploadCloud, X } from "lucide-react";')
          s = s.replace('  const fileRef = useRef<HTMLInputElement>(null);\n', '  const fileRef = useRef<HTMLInputElement>(null);\n  const [pendingFiles, setPendingFiles] = useState<File[]>([]); const [currentFileName, setCurrentFileName] = useState<string | null>(null); const [dragActive, setDragActive] = useState(false);\n')
          s = s.replace('  const reset = () => {', '  const reset = (clearQueue = true) => {')
          s = s.replace('setCreatedProducts([]); if (fileRef.current) fileRef.current.value = ""; };', 'setCreatedProducts([]); if (clearQueue) { setPendingFiles([]); setCurrentFileName(null); } if (fileRef.current) fileRef.current.value = ""; };')
          needle = '  const onFile = async (file: File) => { setBusy(true);'
          insert = '  const handleFiles = async (fileList: FileList | File[]) => { const files = Array.from(fileList).filter((file) => file.type.startsWith("image/")); if (!files.length) { toast.error("Vyberte alespoň jeden obrázek."); return; } if (files.length > 1) toast.info(`Přidáno ${files.length} screenshotů do fronty.`); setPendingFiles(files.slice(1)); setCurrentFileName(files[0].name); await onFile(files[0]); };\n  const finishImportedFile = () => { const [next, ...rest] = pendingFiles; onImported?.(); reset(false); setPendingFiles(rest); if (next) { setCurrentFileName(next.name); void onFile(next); toast.info(`Pokračuji dalším screenshotem (${rest.length + 1} ve frontě).`); } else { setCurrentFileName(null); toast.success("Všechny screenshoty z fronty byly zpracovány."); } };\n  const onFile = async (file: File) => { setCurrentFileName(file.name); setBusy(true);'
          if needle not in s: raise SystemExit('onFile needle not found')
          s = s.replace(needle, insert, 1)
          old_success = 'qc.invalidateQueries(); toast.success(`Importováno ${count} řádků.`); onImported?.(); reset();'
          if old_success not in s: raise SystemExit('success needle not found')
          s = s.replace(old_success, 'qc.invalidateQueries(); toast.success(`Importováno ${count} řádků.`); finishImportedFile();', 1)
          old_ui = '<input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) void onFile(f); }} />{!result ? <div className="grid gap-2"><Button size="lg" className="h-12 w-full" disabled={busy} onClick={() => fileRef.current?.click()}>{busy ? <><Loader2 className="h-4 w-4 animate-spin" /> Rozpoznávám…</> : <><ImageUp className="h-4 w-4" /> Nahrát screenshot</>}</Button><p className="text-xs text-muted-foreground">Data se nikdy neuloží automaticky – nejprve zobrazíme návrh k odsouhlasení. Ruční zadávání zůstává beze změny.</p></div> :'
          new_ui = '<input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => { if (e.target.files?.length) void handleFiles(e.target.files); }} />{!result ? <div className="grid gap-3"><div onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }} onDragOver={(e) => { e.preventDefault(); setDragActive(true); }} onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }} onDrop={(e) => { e.preventDefault(); setDragActive(false); void handleFiles(e.dataTransfer.files); }} className={`rounded-lg border-2 border-dashed p-5 text-center transition-colors ${dragActive ? "border-primary bg-primary/10" : "border-muted-foreground/25 bg-muted/20"}`}><UploadCloud className="mx-auto mb-2 h-7 w-7 text-muted-foreground" /><div className="text-sm font-medium">Přetáhněte screenshoty sem</div><div className="mt-1 text-xs text-muted-foreground">Můžete vložit více obrázků najednou</div><Button type="button" variant="secondary" className="mt-3" disabled={busy} onClick={() => fileRef.current?.click()}>{busy ? <><Loader2 className="h-4 w-4 animate-spin" /> Rozpoznávám…</> : <><ImageUp className="h-4 w-4" /> Vybrat screenshoty</>}</Button></div>{pendingFiles.length || currentFileName ? <div className="flex items-center gap-2 rounded-md border px-3 py-2 text-xs text-muted-foreground"><Images className="h-4 w-4 shrink-0" /><span>{currentFileName ? `Aktuálně: ${currentFileName}` : "Připraveno"}{pendingFiles.length ? ` · ${pendingFiles.length} dalších ve frontě` : ""}</span></div> : null}<p className="text-xs text-muted-foreground">Data se nikdy neuloží automaticky – nejprve zobrazíme návrh k odsouhlasení. Ruční zadávání zůstává beze změny.</p></div> :'
          if old_ui not in s: raise SystemExit('UI needle not found')
          s = s.replace(old_ui, new_ui, 1)
          s = s.replace('export function ScreenshotImport', marker + '\nexport function ScreenshotImport', 1)
          p.write_text(s)
          PY
          git config user.name 'stordik-alt'
          git config user.email 'stordik@gmail.com'
          git add src/components/ScreenshotImport.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add multi-screenshot drag and drop import'
          git push origin redesign
          git rm .github/workflows/apply-multi-screenshot-import.yml
          git commit -m 'chore: remove one-shot patch workflow'
          git push origin redesign
