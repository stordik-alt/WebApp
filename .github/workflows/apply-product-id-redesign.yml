name: Apply Product ID import redesign
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply Product ID import modal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ScreenshotImport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/ScreenshotImport.tsx')
          s=p.read_text()
          s=s.replace('import { AlertTriangle, Check, ImageUp, Loader2, Plus, Trash2, X } from "lucide-react";', 'import { AlertTriangle, Check, ImageUp, Loader2, Plus, Trash2, X, PackagePlus } from "lucide-react";')
          s=s.replace('import { Dialog, DialogContent, DialogFooter, DialogHeader, DialogTitle } from "@/components/ui/dialog";', 'import { Dialog, DialogContent, DialogFooter, DialogHeader, DialogTitle, DialogDescription } from "@/components/ui/dialog";')
          s=s.replace('  const [newProductModalOpen, setNewProductModalOpen] = useState(false); const [pendingProduct, setPendingProduct] = useState<DraftProduct | null>(null); const [capacityHA, setCapacityHA] = useState("1"); const [capacityTUP, setCapacityTUP] = useState("1"); const [productNorm, setProductNorm] = useState("");', '  const [productSetupOpen, setProductSetupOpen] = useState(false); const [productSetupSaving, setProductSetupSaving] = useState(false); const [productSetup, setProductSetup] = useState({ name: "", hCode: "", tCode: "", hNorm: "", tNorm: "", hCapacity: "1", tCapacity: "1" }); const [pendingProductCode, setPendingProductCode] = useState(""); const [productFamily, setProductFamily] = useState<{ familyId: string; hProduct: Product; tProduct: Product } | null>(null);')
          s=s.replace('setNewProductModalOpen(false); setPendingProduct(null); setCapacityHA("1"); setCapacityTUP("1"); setProductNorm("");', 'setProductSetupOpen(false); setProductSetupSaving(false); setProductSetup({ name: "", hCode: "", tCode: "", hNorm: "", tNorm: "", hCapacity: "1", tCapacity: "1" }); setPendingProductCode(""); setProductFamily(null);')
          start=s.index('  // Create new product function')
          end=s.index('  const onFile = async (file: File) => {')
          new=r'''  const openProductSetup = (detected: DraftProduct[]) => {
    const missing = detected.filter((p) => !findProductByCode(products, p.product_code));
    if (!missing.length) return;
    const first = missing[0]; const base = first.product_code.replace(/^H_|^T_/i, "");
    const h = detected.find((p) => /^H_/i.test(p.product_code)); const t = detected.find((p) => /^T_/i.test(p.product_code));
    setPendingProductCode(first.product_code);
    setProductSetup({ name: base ? `Produkt ${base}` : "", hCode: h?.product_code || (/^H_/i.test(first.product_code) ? first.product_code : `H_${base}`), tCode: t?.product_code || (/^T_/i.test(first.product_code) ? first.product_code : `T_${base}`), hNorm: h?.norm_per_hour != null ? String(h.norm_per_hour) : (!/^T_/i.test(first.product_code) && first.norm_per_hour != null ? String(first.norm_per_hour) : ""), tNorm: t?.norm_per_hour != null ? String(t.norm_per_hour) : (/^T_/i.test(first.product_code) && first.norm_per_hour != null ? String(first.norm_per_hour) : ""), hCapacity: "1", tCapacity: "1" });
    setProductSetupOpen(true);
  };

  const createProductFamily = async () => {
    const name = productSetup.name.trim(), hCode = productSetup.hCode.trim(), tCode = productSetup.tCode.trim();
    const hNorm = Number(productSetup.hNorm), tNorm = Number(productSetup.tNorm), hCapacity = Number(productSetup.hCapacity), tCapacity = Number(productSetup.tCapacity);
    if (!name) throw new Error("Zadejte název Product ID."); if (!/^H_/i.test(hCode)) throw new Error("H_ varianta musí začínat H_."); if (!/^T_/i.test(tCode)) throw new Error("T_ varianta musí začínat T_."); if (hCode.toLowerCase() === tCode.toLowerCase()) throw new Error("H_ a T_ varianta musí mít odlišný kód."); if (!Number.isFinite(hNorm) || hNorm <= 0 || !Number.isFinite(tNorm) || tNorm <= 0) throw new Error("Zadejte platnou normu H_ i T_."); if (!Number.isInteger(hCapacity) || hCapacity < 1 || !Number.isInteger(tCapacity) || tCapacity < 1) throw new Error("Kapacita operátorů musí být celé číslo alespoň 1.");
    setProductSetupSaving(true);
    try {
      const date = workDate || new Date().toISOString().slice(0, 10); const findByCode = (code: string) => products.find((p) => p.code.trim().toLowerCase() === code.toLowerCase());
      const createProduct = async (code: string, capacity: number) => { const existing = findByCode(code); if (existing) return existing; const { data, error } = await supabase.from("products").insert({ code, name, employees_per_product: capacity, first_seen_date: date, ...approval() }).select("*").single(); if (error) throw error; return data as Product; };
      const hProduct = await createProduct(hCode, hCapacity); const tProduct = await createProduct(tCode, tCapacity); if (hProduct.id === tProduct.id) throw new Error("H_ a T_ nesmí odkazovat na stejný produkt.");
      const { data: familyData, error: familyError } = await (supabase.from("product_families") as any).insert({ name, h_product_id: hProduct.id, t_product_id: tProduct.id }).select("id").single(); if (familyError) throw familyError; const familyId = familyData.id as string;
      const { error: hp } = await (supabase.from("products") as any).update({ family_id: familyId, variant_type: "H", name, employees_per_product: hCapacity }).eq("id", hProduct.id); if (hp) throw hp;
      const { error: tp } = await (supabase.from("products") as any).update({ family_id: familyId, variant_type: "T", name, employees_per_product: tCapacity }).eq("id", tProduct.id); if (tp) throw tp;
      const saveNorm = async (productId: string, operation: "HA" | "TUP", value: number, note: string) => { const current = currentNorm(norms, productId, operation); if (current && Number(current.norm_per_hour) === value) return; if (current) { const { error } = await supabase.from("product_norms").update({ valid_to: date }).eq("id", current.id); if (error) throw error; } const { error } = await supabase.from("product_norms").insert({ product_id: productId, operation, norm_per_hour: value, valid_from: date, source: "screenshot", confirmed: true, note, ...approval() }); if (error) throw error; };
      await saveNorm(hProduct.id, "HA", hNorm, "Norma H_ varianty vytvořená při importu screenshotu"); await saveNorm(tProduct.id, "TUP", tNorm, "Norma T_ varianty vytvořená při importu screenshotu");
      await (supabase.from("product_relationships") as any).delete().eq("target_product_id", tProduct.id).eq("relationship_type", "HA_TO_TUP"); const { error: linkError } = await (supabase.from("product_relationships") as any).insert({ source_product_id: hProduct.id, target_product_id: tProduct.id, relationship_type: "HA_TO_TUP", ...approval() }); if (linkError && !/duplicate/i.test(linkError.message)) throw linkError;
      setProductFamily({ familyId, hProduct, tProduct }); setProductSetupOpen(false); qc.invalidateQueries({ queryKey: ["products"] }); qc.invalidateQueries({ queryKey: ["product_norms"] }); toast.success(`Product ID „${name}" bylo vytvořeno a připraveno pro import.`);
    } finally { setProductSetupSaving(false); }
  };

'''
          s=s[:start]+new+s[end:]
          s=re.sub(r'      const newProducts = allNewProducts\.filter\(p => !findProductByCode\(products, p\.product_code\)\);\n      if \(newProducts\.length > 0\) \{.*?\n      \}', '      const newProducts = nextDrafts.filter((p) => !findProductByCode(products, p.product_code));\n      if (newProducts.length > 0) openProductSetup(nextDrafts);', s, count=1, flags=re.S)
          old=re.search(r'      const productByCode = new Map<string, Product>\(\);.*?      const records = selected\.map\(\(r\) => \(\{ employee_id: r\.employeeId, work_date: workDate, shift, line: line\.trim\(\), product_id: product\.id, position: r\.position, oee: Number\(r\.oee\) \|\| 0, performance: Number\(r\.performance\) \|\| 0, available_time: Number\(r\.availableTime\) \|\| 0, help_score: Number\(r\.helpScore\) \|\| 0, screenshot_path: screenshotPath, \.\.\.approval\(\) \}\)\);', s, flags=re.S)
          if not old: raise SystemExit('confirm import block not found')
          new2='''      if (missingProductCodes.length && !productFamily) throw new Error("Nejprve dokončete založení Product ID v okně pro nový produkt.");
      const productByCode = new Map<string, Product>();
      for (const d of drafts) { const existing = findProductByCode(products, d.product_code); if (existing) productByCode.set(d.product_code.toLowerCase(), existing); }
      if (productFamily) { productByCode.set(productFamily.hProduct.code.toLowerCase(), productFamily.hProduct); productByCode.set(productFamily.tProduct.code.toLowerCase(), productFamily.tProduct); }
      const primary = productByCode.get(drafts[0].product_code.toLowerCase());
      const hProduct = productFamily?.hProduct || productByCode.get((drafts.find((d) => /^H_/i.test(d.product_code))?.product_code || "").toLowerCase());
      const tProduct = productFamily?.tProduct || productByCode.get((drafts.find((d) => /^T_/i.test(d.product_code))?.product_code || "").toLowerCase());
      if (!primary && !hProduct && !tProduct) throw new Error("Produkt se nepodařilo dohledat.");
      const records = selected.map((r) => { const positionProduct = r.position === "TUP" ? tProduct : hProduct; const product = positionProduct || primary; if (!product) throw new Error(`Pro pozici ${r.position} nebyl nalezen Product ID.`); return { employee_id: r.employeeId, work_date: workDate, shift, line: line.trim(), product_id: product.id, position: r.position, oee: Number(r.oee) || 0, performance: Number(r.performance) || 0, available_time: Number(r.availableTime) || 0, help_score: Number(r.helpScore) || 0, screenshot_path: screenshotPath, ...approval() }; });'''
          s=s[:old.start()]+new2+s[old.end():]
          s=re.sub(r'  const allNewProducts = useMemo\(.*?  }, \[productDrafts, products\]\);\n', '', s, count=1, flags=re.S)
          s=s.replace('  const lowConf = (c: number) => c < 0.7;\n\n  return', '  const lowConf = (c: number) => c < 0.7;\n  const importBlocked = missingProductCodes.length > 0 && !productFamily;\n\n  return')
          old_dialog=re.search(r'    <Dialog open=\{newProductModalOpen\}.*?</Dialog>\n', s, flags=re.S)
          if not old_dialog: raise SystemExit('old dialog not found')
          new_dialog='''    <Dialog open={productSetupOpen} onOpenChange={(open) => { if (!productSetupSaving) setProductSetupOpen(open); }}><DialogContent className="max-h-[90vh] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto p-0"><DialogHeader className="border-b px-6 py-5"><div className="flex items-start gap-3"><div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary"><PackagePlus className="h-5 w-5" /></div><div><DialogTitle className="text-lg">Vytvořit nové Product ID</DialogTitle><DialogDescription className="mt-1">Product ID „{pendingProductCode || primaryProductCode}" zatím neexistuje. Zadejte údaje pro jeho založení.</DialogDescription></div></div></DialogHeader><div className="grid gap-4 px-6 py-5"><div className="rounded-xl border bg-muted/20 p-4"><div className="mb-3 text-sm font-semibold">Základní informace</div><div className="grid gap-3"><div className="grid gap-1.5"><Label>Název Product ID <span className="text-destructive">*</span></Label><Input value={productSetup.name} onChange={(e) => setProductSetup((s) => ({ ...s, name: e.target.value }))} placeholder="Např. Držák motoru" autoFocus /></div><div className="grid grid-cols-1 gap-3 sm:grid-cols-2"><div className="grid gap-1.5"><Label>H_ varianta <span className="text-destructive">*</span></Label><Input value={productSetup.hCode} onChange={(e) => setProductSetup((s) => ({ ...s, hCode: e.target.value }))} placeholder="H_ABC123" /><p className="text-[11px] text-muted-foreground">Kód varianty pro HA</p></div><div className="grid gap-1.5"><Label>T_ varianta <span className="text-destructive">*</span></Label><Input value={productSetup.tCode} onChange={(e) => setProductSetup((s) => ({ ...s, tCode: e.target.value }))} placeholder="T_ABC123" /><p className="text-[11px] text-muted-foreground">Kód varianty pro TUP</p></div></div></div></div><div className="rounded-xl border bg-muted/20 p-4"><div className="mb-3 text-sm font-semibold">Normy (ks/h)</div><div className="grid grid-cols-1 gap-3 sm:grid-cols-2"><div className="grid gap-1.5"><Label>Norma H_ (HA) <span className="text-destructive">*</span></Label><Input type="number" inputMode="decimal" min="0.1" step="0.1" value={productSetup.hNorm} onChange={(e) => setProductSetup((s) => ({ ...s, hNorm: e.target.value }))} placeholder="ks/h" /></div><div className="grid gap-1.5"><Label>Norma T_ (TUP) <span className="text-destructive">*</span></Label><Input type="number" inputMode="decimal" min="0.1" step="0.1" value={productSetup.tNorm} onChange={(e) => setProductSetup((s) => ({ ...s, tNorm: e.target.value }))} placeholder="ks/h" /></div></div></div><div className="rounded-xl border bg-muted/20 p-4"><div className="mb-3 text-sm font-semibold">Kapacita operátorů</div><div className="grid grid-cols-1 gap-3 sm:grid-cols-2"><div className="grid gap-1.5"><Label>Kapacita H_ (HA) <span className="text-destructive">*</span></Label><Input type="number" min="1" step="1" inputMode="numeric" value={productSetup.hCapacity} onChange={(e) => setProductSetup((s) => ({ ...s, hCapacity: e.target.value }))} /><p className="text-[11px] text-muted-foreground">Počet operátorů pro H_ variantu</p></div><div className="grid gap-1.5"><Label>Kapacita T_ (TUP) <span className="text-destructive">*</span></Label><Input type="number" min="1" step="1" inputMode="numeric" value={productSetup.tCapacity} onChange={(e) => setProductSetup((s) => ({ ...s, tCapacity: e.target.value }))} /><p className="text-[11px] text-muted-foreground">Počet operátorů pro T_ variantu</p></div></div></div><div className="rounded-lg border border-primary/30 bg-primary/5 px-4 py-3 text-sm text-muted-foreground"><strong className="text-foreground">Po potvrzení:</strong> vytvoří se Product ID, H_/T_ produkty, obě normy, kapacity a vazba H_ → T_. Tyto hodnoty se následně použijí i v denních záznamech.</div></div><DialogFooter className="border-t px-6 py-4"><Button variant="outline" disabled={productSetupSaving} onClick={() => setProductSetupOpen(false)}>Zrušit</Button><Button disabled={productSetupSaving} onClick={() => void createProductFamily().catch((e: Error) => toast.error(e.message))}>{productSetupSaving ? <Loader2 className="h-4 w-4 animate-spin" /> : <PackagePlus className="h-4 w-4" />} Vytvořit a použít</Button></DialogFooter></DialogContent></Dialog>
'''
          s=s[:old_dialog.start()]+new_dialog+s[old_dialog.end():]
          s=s.replace('      <div className="rounded-md border border-warning/40 bg-warning/10 px-3 py-2 text-sm"><strong>Zkontrolujte importovaná data.</strong>', '      {importBlocked ? <div className="flex items-start gap-2 rounded-md border border-warning/40 bg-warning/10 px-3 py-2 text-sm"><AlertTriangle className="mt-0.5 h-4 w-4 shrink-0" /><div><strong>Nové Product ID vyžaduje založení.</strong> Dokončete nastavení v okně uprostřed obrazovky. Import denních záznamů je do té doby zablokovaný.</div></div> : null}\n      <div className="rounded-md border border-warning/40 bg-warning/10 px-3 py-2 text-sm"><strong>Zkontrolujte importovaná data.</strong>')
          s=s.replace('disabled={confirmImport.isPending || !rows.some((r) => r.include && r.employeeId)}', 'disabled={confirmImport.isPending || importBlocked || !rows.some((r) => r.include && r.employeeId)}')
          p.write_text(s)
          PY
          git diff --check
          git add src/components/ScreenshotImport.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: apply Product ID import modal'
          rm -f .github/workflows/apply-product-id-redesign.yml
          git add -A
          git commit --allow-empty -m 'chore: remove temporary import redesign workflow'
          git push
