name: Apply UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-table-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Products: make the edit action visibly scroll to the editor.
          p = Path('src/routes/produkty.tsx')
          s = p.read_text()
          old = '''  const startEdit = (p: Product) => {\n    setEditProduct(p);'''
          new = '''  const startEdit = (p: Product) => {\n    setEditProduct(p);\n    window.requestAnimationFrame(() => {\n      document.getElementById("edit-product-card")?.scrollIntoView({ behavior: "smooth", block: "center" });\n    });'''
          if old in s and 'edit-product-card' not in s:
              s = s.replace(old, new, 1)
          s = s.replace('{editProduct ? <Card className="min-w-0 gap-4 overflow-hidden p-4 sm:p-5">', '{editProduct ? <Card id="edit-product-card" className="min-w-0 gap-4 overflow-hidden p-4 sm:p-5">', 1)
          p.write_text(s)

          # Daily data: filters + sorting.
          p = Path('src/routes/denni-data.tsx')
          s = p.read_text()
          marker = '  const [editingRecord, setEditingRecord] = useState<DailyRecord | null>(null);\n'
          additions = marker + '''  const [dailyFilterText, setDailyFilterText] = useState("");\n  const [dailyFilterShift, setDailyFilterShift] = useState("all");\n  const [dailyFilterDate, setDailyFilterDate] = useState("");\n  const [dailySort, setDailySort] = useState<"date" | "employee" | "oee" | "performance" | "availableTime">("date");\n  const [dailySortDir, setDailySortDir] = useState<"asc" | "desc">("desc");\n'''
          if marker in s and 'dailyFilterText' not in s:
              s = s.replace(marker, additions, 1)
          old = '  const recentShifts = shiftAggregates.slice(0, 25);\n'
          new = '''  const filteredShifts = useMemo(() => {\n    const text = dailyFilterText.trim().toLowerCase();\n    const filtered = shiftAggregates.filter((a) => {\n      if (dailyFilterShift !== "all" && a.shift !== dailyFilterShift) return false;\n      if (dailyFilterDate && a.work_date !== dailyFilterDate) return false;\n      if (text && !empName(a.employee_id).toLowerCase().includes(text) && !a.lines.join(" ").toLowerCase().includes(text)) return false;\n      return true;\n    });\n    const value = (a: ShiftAggregate) => dailySort === "date" ? `${a.work_date} ${a.shift}` : dailySort === "employee" ? empName(a.employee_id).toLowerCase() : Number(dailySort === "oee" ? a.oee ?? -Infinity : dailySort === "performance" ? a.performance ?? -Infinity : a.availableTime ?? -Infinity);\n    filtered.sort((a, b) => { const av = value(a), bv = value(b); const cmp = av < bv ? -1 : av > bv ? 1 : 0; return dailySortDir === "asc" ? cmp : -cmp; });\n    return filtered.slice(0, 100);\n  }, [shiftAggregates, dailyFilterText, dailyFilterShift, dailyFilterDate, dailySort, dailySortDir, employees]);\n'''
          if old in s and 'const filteredShifts' not in s:
              s = s.replace(old, new, 1)
          s = s.replace('              <div className="flex items-center justify-between border-b border-border px-4 py-3 text-sm font-semibold">', '''              <div className="flex flex-wrap items-center gap-2 border-b border-border px-4 py-3">\n                <Input className="h-9 w-[180px]" placeholder="Hledat zaměstnance/linku" value={dailyFilterText} onChange={(e) => setDailyFilterText(e.target.value)} />\n                <Input className="h-9 w-[140px]" type="date" value={dailyFilterDate} onChange={(e) => setDailyFilterDate(e.target.value)} />\n                <Select value={dailyFilterShift} onValueChange={setDailyFilterShift}>\n                  <SelectTrigger className="h-9 w-[140px]"><SelectValue placeholder="Směna" /></SelectTrigger>\n                  <SelectContent><SelectItem value="all">Všechny směny</SelectItem>{SHIFTS.map((s) => <SelectItem key={s} value={s}>{s}</SelectItem>)}</SelectContent>\n                </Select>\n                <Select value={dailySort} onValueChange={(v) => setDailySort(v as typeof dailySort)}>\n                  <SelectTrigger className="h-9 w-[150px]"><SelectValue placeholder="Řadit podle" /></SelectTrigger>\n                  <SelectContent><SelectItem value="date">Datum</SelectItem><SelectItem value="employee">Zaměstnanec</SelectItem><SelectItem value="oee">OEE</SelectItem><SelectItem value="performance">Výkon</SelectItem><SelectItem value="availableTime">Dostupnost</SelectItem></SelectContent>\n                </Select>\n                <Button size="sm" variant="outline" onClick={() => setDailySortDir((d) => d === "asc" ? "desc" : "asc")}>{dailySortDir === "asc" ? "↑" : "↓"}</Button>\n                <Button size="sm" variant="ghost" onClick={() => { setDailyFilterText(""); setDailyFilterShift("all"); setDailyFilterDate(""); }}>Zrušit filtry</Button>\n              </div>\n              <div className="flex items-center justify-between px-4 py-2 text-xs text-muted-foreground">\n                <span>{filteredShifts.length} zobrazených směn</span>\n                <span>Řazení: {dailySortDir === "asc" ? "vzestupně" : "sestupně"}</span>\n              </div>\n              <div className="hidden">''', 1)
          # Close the hidden wrapper immediately before the table if it was inserted.
          s = s.replace('                <span>Řazení: {dailySortDir === "asc" ? "vzestupně" : "sestupně"}</span>\n              </div>\n              <div className="hidden">\n            {recentShifts', '                <span>Řazení: {dailySortDir === "asc" ? "vzestupně" : "sestupně"}</span>\n              </div>\n              <Table>', 1)
          s = s.replace('              <Table>\n            <TableHeader>', '              <Table>\n            <TableHeader>', 1)
          s = s.replace('                recentShifts.flatMap((a) => [', '                filteredShifts.flatMap((a) => [', 1)
          p.write_text(s)

          # Weekly data: filters + sorting.
          p = Path('src/routes/tydenni-data.tsx')
          s = p.read_text()
          s = s.replace('import { useState } from "react";', 'import { useMemo, useState } from "react";', 1)
          marker = '  const [yieldPct, setYieldPct] = useState("");\n'
          additions = marker + '''  const [weeklyFilterText, setWeeklyFilterText] = useState("");\n  const [weeklyFilterStatus, setWeeklyFilterStatus] = useState("all");\n  const [weeklySort, setWeeklySort] = useState<"employee" | "week" | "yield" | "score">("week");\n  const [weeklySortDir, setWeeklySortDir] = useState<"asc" | "desc">("desc");\n'''
          if marker in s and 'weeklyFilterText' not in s:
              s = s.replace(marker, additions, 1)
          marker2 = '  const openAlerts = weekly.filter((w) => w.is_alert && !w.alert_resolved);\n'
          additions2 = marker2 + '''  const filteredWeekly = useMemo(() => {\n    const text = weeklyFilterText.trim().toLowerCase();\n    const rows = weekly.filter((w) => {\n      if (weeklyFilterStatus === "alert" && !w.is_alert) return false;\n      if (weeklyFilterStatus === "ok" && w.is_alert) return false;\n      if (text && !empName(w.employee_id).toLowerCase().includes(text)) return false;\n      return true;\n    });\n    const value = (w: WeeklyRecord) => weeklySort === "employee" ? empName(w.employee_id).toLowerCase() : weeklySort === "week" ? `${w.iso_year}-${String(w.iso_week).padStart(2, "0")}` : Number(weeklySort === "yield" ? w.yield_pct : w.final_quality_score ?? w.auto_quality_score ?? -Infinity);\n    rows.sort((a, b) => { const av = value(a), bv = value(b); const cmp = av < bv ? -1 : av > bv ? 1 : 0; return weeklySortDir === "asc" ? cmp : -cmp; });\n    return rows;\n  }, [weekly, weeklyFilterText, weeklyFilterStatus, weeklySort, weeklySortDir, employees]);\n'''
          if marker2 in s and 'const filteredWeekly' not in s:
              s = s.replace(marker2, additions2, 1)
          s = s.replace('          <div className="border-b border-border px-4 py-3 text-sm font-semibold">\n            Týdenní záznamy\n          </div>', '''          <div className="flex flex-wrap items-center gap-2 border-b border-border px-4 py-3">\n            <Input className="h-9 w-[180px]" placeholder="Hledat zaměstnance" value={weeklyFilterText} onChange={(e) => setWeeklyFilterText(e.target.value)} />\n            <Select value={weeklyFilterStatus} onValueChange={setWeeklyFilterStatus}>\n              <SelectTrigger className="h-9 w-[150px]"><SelectValue /></SelectTrigger>\n              <SelectContent><SelectItem value="all">Všechny stavy</SelectItem><SelectItem value="ok">OK</SelectItem><SelectItem value="alert">Quality Alert</SelectItem></SelectContent>\n            </Select>\n            <Select value={weeklySort} onValueChange={(v) => setWeeklySort(v as typeof weeklySort)}>\n              <SelectTrigger className="h-9 w-[140px]"><SelectValue /></SelectTrigger>\n              <SelectContent><SelectItem value="week">Týden</SelectItem><SelectItem value="employee">Zaměstnanec</SelectItem><SelectItem value="yield">Yield</SelectItem><SelectItem value="score">Quality skóre</SelectItem></SelectContent>\n            </Select>\n            <Button size="sm" variant="outline" onClick={() => setWeeklySortDir((d) => d === "asc" ? "desc" : "asc")}>{weeklySortDir === "asc" ? "↑" : "↓"}</Button>\n            <Button size="sm" variant="ghost" onClick={() => { setWeeklyFilterText(""); setWeeklyFilterStatus("all"); }}>Zrušit filtry</Button>\n            <span className="ml-auto text-xs text-muted-foreground">{filteredWeekly.length} záznamů</span>\n          </div>''', 1)
          s = s.replace('                weekly.map((w) => (', '                filteredWeekly.map((w) => (', 1)
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/produkty.tsx src/routes/denni-data.tsx src/routes/tydenni-data.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add sorting and filtering to data tables"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/apply-table-fixes.yml
          git commit -m "chore: remove one-time table fix workflow"
          git push
