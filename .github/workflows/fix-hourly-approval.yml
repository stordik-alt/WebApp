name: Fix hourly approval validation

on:
  push:
    branches:
      - Verze-2.01-Auto

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Verze-2.01-Auto
      - name: Patch hourly KPI blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/import-v2-auto.ts')
          s = p.read_text()
          old = '  let effectiveBlockers = [...new Set(blockers)].filter((b) => b !== "HOURLY_KPI_MISSING");\n'
          new = '''  let effectiveBlockers = [...new Set(blockers)].filter((b) => b !== "HOURLY_KPI_MISSING");
          const hourlyKpiAuthoritative = hourly.some((m) => Number.isFinite(Number(m.performance_pct)) && Number.isFinite(Number(m.availability_pct)) && Number.isFinite(Number(m.actual_oee_pct)));
          if (hourlyKpiAuthoritative) {
            effectiveBlockers = effectiveBlockers.filter((b) => b !== "OEE_MISSING" && b !== "PERFORMANCE_MISSING" && b !== "AVAILABILITY_MISSING");
          }
'''
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/import-v2-auto.ts
          git commit -m 'fix 2.01 AUTO hourly KPI blockers' || exit 0
          git push origin Verze-2.01-Auto
