name: Fix screenshot import syntax
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix screenshot import syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ScreenshotImportV2.tsx')
          s = p.read_text()
          old = 'const r = await extractHourly({ data: { imageDataUrl: image, context: { profiles: relevant, operator_count: operatorCount } });'
          new = 'const r = await extractHourly({ data: { imageDataUrl: image, context: { profiles: relevant, operator_count: operatorCount } } });'
          if old not in s:
              raise SystemExit('Expected malformed extractHourly line not found')
          p.write_text(s.replace(old, new, 1))
          wf = Path('.github/workflows/fix-import-syntax.yml')
          wf.unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScreenshotImportV2.tsx .github/workflows/fix-import-syntax.yml
          git commit -m 'Fix screenshot import syntax'
          git push
