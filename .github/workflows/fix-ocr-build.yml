name: One-time OCR build fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: OCR prompt syntax') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair OCR prompt template literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ocr.functions.ts')
          s = p.read_text(encoding='utf-8')
          start = s.index('const SYSTEM = `')
          marker = '`;\n\nfunction toNum'
          end = s.index(marker, start)
          opening = 'const SYSTEM = `'
          inner = s[start + len(opening):end]
          # The prompt itself contains Markdown-style inline backticks. Escape
          # every unescaped backtick inside the template literal, while first
          # normalizing already escaped ones so this is idempotent.
          inner = inner.replace('\\`', '`')
          inner = inner.replace('`', '\\`')
          fixed = s[:start] + opening + inner + s[end:]
          p.write_text(fixed, encoding='utf-8')
          PY
      - name: Verify production build
        run: npm ci && npm run build
      - name: Commit verified fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-ocr-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ocr.functions.ts .github/workflows/fix-ocr-build.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: OCR prompt syntax'
          git push
