name: One-time OCR build fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: OCR prompt syntax') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch OCR prompt template literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ocr.functions.ts')
          s = p.read_text(encoding='utf-8')
          start = s.index('const SYSTEM = `')
          end = s.index('`;\n\nfunction toNum', start)
          block = s[start:end]
          opening = 'const SYSTEM = `'
          inner = block[len(opening):]
          inner = inner.replace('\\`', '`').replace('`', '\\`')
          p.write_text(s[:start] + opening + inner + s[end:], encoding='utf-8')
          PY
      - name: Verify production build
        run: npm ci && npm run build
      - name: Commit verified fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-ocr-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ocr.functions.ts .github/workflows/fix-ocr-build.yml
          git commit -m 'fix: OCR prompt syntax'
          git push
