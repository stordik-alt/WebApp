name: One-time OCR build fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: OCR prompt syntax') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix template literal syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ocr.functions.ts')
          s = p.read_text(encoding='utf-8')
          start = s.index('const SYSTEM = `')
          marker = '`;\n\nfunction toNum'
          end = s.index(marker, start)
          block = s[start:end]
          opening = 'const SYSTEM = `'
          inner = block[len(opening):]
          inner = inner.replace('`', "'")
          p.write_text(s[:start] + opening + inner + s[end:], encoding='utf-8')
          PY
          rm .github/workflows/fix-ocr-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ocr.functions.ts .github/workflows/fix-ocr-build.yml
          git commit -m 'fix: OCR prompt syntax'
          git push
