name: One-time OCR shift model cleanup

on:
  push:
    branches: [Verze-2.0-Auto]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: unify legacy OCR shift time model') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Unify legacy OCR shift calculations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ocr.functions.ts')
          s = p.read_text(encoding='utf-8')

          s = s.replace('const START_PREP_MINUTES = 10;', 'const START_PREP_MINUTES = 7;')

          old = '''function effectiveHourWeights(hourlyCount: number): number[] { if (hourlyCount <= 0) return []; const weights = Array.from({ length: hourlyCount }, () => 1); if (hourlyCount === 1) { weights[0] = (SHIFT_MINUTES - START_PREP_MINUTES - BREAK_MINUTES - END_CLEANUP_MINUTES) / 60; return weights; } weights[0] -= START_PREP_MINUTES / 60; weights[hourlyCount - 1] -= END_CLEANUP_MINUTES / 60; if (hourlyCount >= 3) weights[Math.floor(hourlyCount / 2)] -= BREAK_MINUTES / 60; return weights; }'''
          new = '''function effectiveHourWeights(hourly: Record<string, unknown>[], shift: unknown): number[] {
            const s = text(shift).toLowerCase();
            const normalized = s.includes("rann") ? "Ranní" : s.includes("odpo") ? "Odpolední" : s.includes("noč") ? "Noční" : null;
            const startHour = normalized === "Ranní" ? 6 : normalized === "Odpolední" ? 14 : 22;
            const breakStart = normalized === "Ranní" ? 280 : 240;
            const breakEnd = normalized === "Ranní" ? 310 : 270;
            return hourly.map((row) => {
              const hour = firstNum(row, ["hour", "hodina"]);
              if (hour === null) return 1;
              const hourStart = ((hour % 24) * 60 + 1440) % 1440;
              const relative = ((hourStart - startHour * 60) + 1440) % 1440;
              if (relative >= 480) return 0;
              const hourEnd = relative + 60;
              let productive = 60;
              if (relative === 0) productive -= START_PREP_MINUTES;
              if (relative + 60 === 480) productive -= END_CLEANUP_MINUTES;
              const overlap = Math.max(0, Math.min(hourEnd, breakEnd) - Math.max(relative, breakStart));
              productive -= overlap;
              return Math.max(0, Math.min(60, productive)) / 60;
            });
          }'''
          if old not in s:
              raise SystemExit('Expected legacy effectiveHourWeights function was not found')
          s = s.replace(old, new)
          s = s.replace('const weights = effectiveHourWeights(hourly.length);', 'const weights = effectiveHourWeights(hourly, shift);')
          s = s.replace('function predictedShiftOutput(hourly: Record<string, unknown>[]): number | null {', 'function predictedShiftOutput(hourly: Record<string, unknown>[], shift: unknown): number | null {')
          s = s.replace('const expected = predictedShiftOutput(hourly);', 'const expected = predictedShiftOutput(hourly, shift);')
          s = s.replace('function normalizedPerformance(hourly: Record<string, unknown>[]): number | null {', 'function normalizedPerformance(hourly: Record<string, unknown>[], shift: unknown): number | null {')
          s = s.replace('predicted_shift_output: predictedShiftOutput(hourly),', 'predicted_shift_output: predictedShiftOutput(hourly, mergedParsed.shift),')
          s = s.replace('const hourlyPerformance = normalizedPerformance(hourly);', 'const hourlyPerformance = normalizedPerformance(hourly, mergedParsed.shift);')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify production build
        run: npm ci && npm run build
      - name: Commit verified cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-ocr-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ocr.functions.ts .github/workflows/fix-ocr-build.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: unify legacy OCR shift time model'
          git push
