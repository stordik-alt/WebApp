name: Fix Product Side Code

on:
  push:
    branches: [redesign]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ScreenshotImportV2.tsx')
          s = p.read_text()
          old = 'const sideCode = (code: string, side: "HA" | "TUP") => { const raw = code.trim().replace(/\\s+/g, ""); if (!raw) return ""; const upper = raw.toUpperCase(); if (/^[HT]_/.test(upper)) return upper[0] + "_" + raw.slice(2); return `${side === "HA" ? "H" : "T"}_${raw}`; };'
          new = 'const sideCode = (code: string, side: "HA" | "TUP") => { const raw = code.trim().replace(/\\s+/g, ""); if (!raw) return ""; const upper = raw.toUpperCase(); const base = /^[HT]_/.test(upper) ? raw.slice(2) : raw; return `${side === "HA" ? "H" : "T"}_${base}`; };'
          if old not in s:
              raise SystemExit('Expected sideCode definition not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/fix-product-side-code.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScreenshotImportV2.tsx .github/workflows/fix-product-side-code.yml
          git commit -m 'Fix TUP Product ID inference in import'
          git push
