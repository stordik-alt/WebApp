name: Fix screenshot import syntax

on:
  push:
    branches: [redesign]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Fix malformed extractHourly call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ScreenshotImportV2.tsx')
          s = p.read_text()
          bad = 'const r = await extractHourly({ data: { imageDataUrl: image, context: { profiles: relevant, operator_count: operatorCount } });'
          good = 'const r = await extractHourly({ data: { imageDataUrl: image, context: { profiles: relevant, operator_count: operatorCount } } });'
          if bad not in s:
              raise SystemExit('Expected malformed line not found')
          p.write_text(s.replace(bad, good, 1))
          PY
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScreenshotImportV2.tsx
          git commit -m 'Fix screenshot import syntax' || true
          git rm .github/workflows/fix-screenshot-import-syntax.yml
          git commit -m 'Remove temporary syntax fix workflow' || true
          git push origin HEAD:redesign
