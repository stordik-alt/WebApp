name: Fix workplace line parsing
on:
  push:
    branches: [sekce]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix workplace line parsing') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sekce
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/pracoviste.tsx')
          s = p.read_text()
          old = '  const lineMatch = remainder.match(/(?:^|\\s)(L\\d+\\/\\d+(?:\\s+HF)?|Olovo)\\s*$/i);\n  const line_name = lineMatch ? (/^olovo$/i.test(lineMatch[1]) ? "Olovo" : lineMatch[1].toUpperCase()) : "Neurčeno";'
          new = '  const lineMatch = remainder.match(/(?:^|\\s)(L\\d+\\s*\\/\\s*\\d+(?:\\s+HF)?|Olovo)\\s*$/i);\n  const line_name = lineMatch ? (/^olovo$/i.test(lineMatch[1]) ? "Olovo" : lineMatch[1].replace(/\\s*\\/\\s*/g, "/").replace(/\\s+HF$/i, " HF").toUpperCase()) : "Neurčeno";'
          if old not in s:
              raise SystemExit('Target parser text not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/pracoviste.tsx
          git commit -m 'Fix workplace line parsing' || exit 0
          git push origin HEAD:sekce
