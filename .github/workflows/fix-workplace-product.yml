name: Fix workplace product detail

on:
  push:
    branches: [sekce]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix workplace product detail') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch workplace detail product
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/pracoviste.tsx')
          s = p.read_text()
          old = 'let query = supabase.from("daily_records").select("work_date,product,oee,shift").eq("line", workplace.source_line ?? "").order("work_date", { ascending: false });'
          new = 'let query = supabase.from("daily_records").select("work_date,product,product_id,oee,shift,products:product_id(code)").eq("line", workplace.source_line ?? "").order("work_date", { ascending: false });'
          if old not in s:
              raise SystemExit('target query not found')
          s = s.replace(old, new, 1)
          old2 = 'const product = String(row.product ?? "–");'
          new2 = 'const product = String(row.product ?? (Array.isArray((row as any).products) ? (row as any).products[0]?.code : (row as any).products?.code) ?? "–");'
          if old2 not in s:
              raise SystemExit('target product mapping not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/pracoviste.tsx
          git commit -m "Fix workplace product detail"
          git push