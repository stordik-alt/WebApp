name: One-shot Product Profile import refactor

on:
  push:
    branches: [redesign]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[profile-refactor-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ScreenshotImport
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/ScreenshotImport.tsx')
          text = path.read_text(encoding='utf-8')
          if 'upsertImportedProductProfile' in text:
              raise SystemExit('ScreenshotImport already patched')

          text = text.replace(
              'import { currentNorm, findProductByCode, type Product } from "@/lib/products";',
              'import { currentNorm, findProductByCode, type Product } from "@/lib/products";\nimport { upsertImportedProductProfile } from "@/lib/productProfiles";'
          )

          replacement = '''  const createProductIds = async () => { if (!productSetupDrafts.length) return; setProductSetupSaving(true); try { const date = workDate || new Date().toISOString().slice(0, 10); const created: Product[] = []; const items: Array<{ code: string; name: string; norm: string; capacity: string; confidence: number; primary: boolean; sourceKey: string }> = []; const seen = new Set<string>(); for (const draft of productSetupDrafts) { const add = (code: string, name: string, norm: string, capacity: string, primary: boolean) => { const normalized = code.trim().toLowerCase(); if (!normalized || seen.has(normalized)) return; seen.add(normalized); items.push({ code: code.trim(), name: name.trim(), norm, capacity, confidence: draft.confidence, primary, sourceKey: draft.key }); }; add(draft.code, draft.name, draft.norm, draft.capacity, true); if (draft.counterpartCode.trim()) add(draft.counterpartCode, draft.counterpartName, draft.counterpartNorm, draft.counterpartCapacity, false); }
    for (const item of items) { const code = item.code; const norm = Number(item.norm); const capacity = Number(item.capacity); if (!code) throw new Error("Každý Product ID musí mít kód."); let product = findProductByCode(allProducts, code) ?? created.find((p) => p.code.trim().toLowerCase() === code.toLowerCase()); const existedBefore = Boolean(product); const variant = /^T_/i.test(code) ? "T" : "H"; if (!product) { if (!Number.isFinite(norm) || norm <= 0) throw new Error("Zadejte platnou normu pro " + code + "."); if (!Number.isInteger(capacity) || capacity < 1) throw new Error("Zadejte platnou kapacitu operátorů pro " + code + "."); const { data, error } = await supabase.from("products").insert({ code, name: item.name || productIdName.trim(), employees_per_product: capacity, first_seen_date: date, variant_type: variant, ...approval() }).select("*").single(); if (error) throw error; product = data as Product; } else if (item.primary && item.name) { const { data, error } = await supabase.from("products").update({ name: item.name, employees_per_product: Number.isInteger(capacity) && capacity >= 1 ? capacity : product.employees_per_product, variant_type: variant }).eq("id", product.id).select("*").single(); if (error) throw error; product = data as Product; } if (!existedBefore || item.primary) created.push(product); }
    const productByCode = new Map<string, Product>(); [...allProducts, ...created].forEach((p) => productByCode.set(p.code.trim().toLowerCase(), p)); const handledProfiles = new Set<string>(); for (const draft of productSetupDrafts) { const firstCode = draft.code.trim(); const firstItem = items.find((item) => item.code.toLowerCase() === firstCode.toLowerCase()); const counterpartCode = draft.counterpartCode.trim(); const counterpartItem = counterpartCode ? items.find((item) => item.code.toLowerCase() === counterpartCode.toLowerCase()) : undefined; const hCode = /^H_/i.test(firstCode) ? firstCode : counterpartCode; const tCode = /^T_/i.test(firstCode) ? firstCode : counterpartCode; const hItem = /^H_/i.test(firstCode) ? firstItem : counterpartItem; const tItem = /^T_/i.test(firstCode) ? firstItem : counterpartItem; const pairKey = `${(hCode || firstCode).toLowerCase()}|${(tCode || '').toLowerCase()}`; if (handledProfiles.has(pairKey)) continue; handledProfiles.add(pairKey); const hProduct = hCode ? productByCode.get(hCode.toLowerCase()) : undefined; const tProduct = tCode ? productByCode.get(tCode.toLowerCase()) : undefined; await upsertImportedProductProfile({ profileName: productIdName.trim() || firstItem?.name || counterpartItem?.name || null, ha: hProduct && hItem ? { code: hProduct.code, norm: Number(hItem.norm), capacity: Number(hItem.capacity) } : undefined, tup: tProduct && tItem ? { code: tProduct.code, norm: Number(tItem.norm), capacity: Number(tItem.capacity) } : undefined, validFrom: date }); }
    setCreatedProducts((prev) => { const byCode = new Map(prev.map((p) => [p.code.trim().toLowerCase(), p])); created.forEach((p) => byCode.set(p.code.trim().toLowerCase(), p)); return Array.from(byCode.values()); }); setProductDrafts((prev) => prev.map((p) => { const setup = productSetupDrafts.find((d) => d.code.trim().toLowerCase() === p.product_code.trim().toLowerCase()); return setup ? { ...p, norm_per_hour: Number(setup.norm), employees_per_product: Number(setup.capacity) } : p; })); setNewProductModalOpen(false); qc.invalidateQueries({ queryKey: ["products"] }); qc.invalidateQueries({ queryKey: ["product_profiles"] }); qc.invalidateQueries({ queryKey: ["product_norms"] }); toast.success(`Zkontrolováno / založeno ${created.length} Product ID. Pokračuji na zaměstnance.`); if (previewUrl) void runEmployeeStage(previewUrl); } finally { setProductSetupSaving(false); } };'''

          pattern = r'  const createProductIds = async \(\) => \{.*?\n  const runEmployeeStage = async'
          patched, count = re.subn(pattern, replacement + '\n  const runEmployeeStage = async', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('createProductIds block not found')
          path.write_text(patched, encoding='utf-8')
      - name: Commit patched import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-product-profile-import-refactor.yml
          git add src/components/ScreenshotImport.tsx .github/workflows/one-shot-product-profile-import-refactor.yml
          git commit -m "[profile-refactor-done] Refactor screenshot product setup to Product Profiles"
          git push origin redesign
