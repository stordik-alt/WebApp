name: Patch 2.01 hourly source
on:
  push:
    branches: [Verze-2.01-Auto]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch detail source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ImportApprovalQueue.tsx')
          s = p.read_text()
          old = '''  const data = item?.ocr_data ?? {};\n  const hourly = Array.isArray(data.hourly_metrics) ? data.hourly_metrics : [];\n  const listed = Array.isArray(data.products) ? data.products : [];'''
          new = '''  const data = item?.ocr_data ?? {};\n  const hourlyQuery = useQuery({\n    queryKey: ["approval-detail-hourly", item?.id],\n    enabled: Boolean(item?.id),\n    queryFn: async () => {\n      const { data: dbRows, error } = await db.from("import_item_hourly").select("*").eq("import_item_id", item!.id).order("hour").order("id");\n      if (error) throw error;\n      return dbRows ?? [];\n    },\n  });\n  const hourly = hourlyQuery.data?.length ? hourlyQuery.data : (Array.isArray(data.hourly_metrics) ? data.hourly_metrics : []);\n  const listed = Array.isArray(data.products) ? data.products : [];'''
          if old not in s: raise SystemExit('hourly source target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ImportApprovalQueue.tsx
          git commit -m 'Read approval detail from canonical hourly rows'
          git push
