name: Patch 2.01 reconstruction UI
on:
  push:
    branches: [Verze-2.01-Auto]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approval detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ImportApprovalQueue.tsx')
          s = p.read_text()
          old = '''    const output = rows.reduce((sum: number, r: any) => sum + (Number.isFinite(Number(r.actual_output)) ? Number(r.actual_output) : 0), 0);\n    const hours = rows.map((r: any) => Number(r.hour)).filter((h: number) => Number.isFinite(h)).sort((a: number, b: number) => a - b);\n    return { code, rows, norm: Number.isFinite(norm) && norm > 0 ? norm : null, profileFound: Boolean(profile), output, hours, performance: weighted("performance_pct"), availability: weighted("availability_pct"), oee: weighted("actual_oee_pct") };'''
          new = '''    const output = rows.reduce((sum: number, r: any) => sum + (Number.isFinite(Number(r.actual_output)) ? Number(r.actual_output) : 0), 0);\n    const hours = rows.map((r: any) => Number(r.hour)).filter((h: number) => Number.isFinite(h)).sort((a: number, b: number) => a - b);\n    const reconstruction = rows.reduce((best: any, r: any) => {\n      const calc = r?.raw_data?.calculation;\n      return calc?.reconstruction_status ? calc : best;\n    }, null);\n    const capacity = profile ? Number(isHa ? profile.h_capacity : profile.tup_capacity) : null;\n    const operatorCount = rows.reduce((max: number, r: any) => Math.max(max, Number(r.operator_count) || 0), 0) || Number(data.operator_count) || 1;\n    const expected = rows.reduce((sum: number, r: any) => {\n      const calc = r?.raw_data?.calculation;\n      const minutes = Number(calc?.reconstructed_productive_minutes ?? r.actual_minutes ?? 0);\n      const effectiveNorm = Number(calc?.reconstructed_effective_norm ?? (Number(norm) * minutes / 60));\n      if (!Number.isFinite(effectiveNorm) || effectiveNorm < 0) return sum;\n      const cap = Number(r.capacity ?? capacity);\n      const ops = Number(r.operator_count ?? operatorCount);\n      return sum + (Number.isFinite(cap) && cap > 0 && Number.isFinite(ops) && ops > 0 ? effectiveNorm * cap / ops : effectiveNorm);\n    }, 0);\n    return { code, rows, norm: Number.isFinite(norm) && norm > 0 ? norm : null, capacity: Number.isFinite(capacity) && capacity > 0 ? capacity : null, operatorCount, profileFound: Boolean(profile), output, expected, hours, reconstruction, performance: weighted("performance_pct"), availability: weighted("availability_pct"), oee: weighted("actual_oee_pct") };'''
          if old not in s: raise SystemExit('calculation target not found')
          s = s.replace(old, new, 1)
          old_ui = '''<div className="mt-2 grid grid-cols-2 gap-2 text-xs sm:grid-cols-5"><div><div className="text-muted-foreground">Hodiny</div><div className="font-medium">{product.hours.length ? product.hours.join(", ") : "—"}</div></div><div><div className="text-muted-foreground">Výstup</div><div className="font-medium">{product.output || "—"}</div></div><div><div className="text-muted-foreground">Výkon</div><div className="font-medium">{product.performance != null ? `${product.performance.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">Dostupnost</div><div className="font-medium">{product.availability != null ? `${product.availability.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">OEE</div><div className="font-medium">{product.oee != null ? `${product.oee.toFixed(2)} %` : "—"}</div></div></div>'''
          new_ui = '''<div className="mt-2 grid grid-cols-2 gap-2 text-xs sm:grid-cols-7"><div><div className="text-muted-foreground">Hodiny</div><div className="font-medium">{product.hours.length ? product.hours.join(", ") : "—"}</div></div><div><div className="text-muted-foreground">Vyrobeno</div><div className="font-medium">{product.output || "—"} ks</div></div><div><div className="text-muted-foreground">Očekáváno</div><div className="font-medium">{product.expected > 0 ? `${product.expected.toFixed(0)} ks` : "—"}</div></div><div><div className="text-muted-foreground">Výkon</div><div className="font-medium">{product.performance != null ? `${product.performance.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">Dostupnost</div><div className="font-medium">{product.availability != null ? `${product.availability.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">OEE</div><div className="font-medium">{product.oee != null ? `${product.oee.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">Kapacita / operátoři</div><div className="font-medium">{product.capacity != null ? `${product.capacity} / ${product.operatorCount}` : "—"}</div></div></div>{product.reconstruction?.reconstruction_status ? <div className="mt-2 rounded-md border border-amber-500/30 bg-amber-500/10 px-2 py-1 text-xs"><span className="font-medium">Rekonstruovaný čas:</span> {Number(product.reconstruction.reconstructed_productive_minutes).toFixed(2)} min · odvozeno z výstupu a master normy · jistota: odvozená</div> : null}'''
          if old_ui not in s: raise SystemExit('UI target not found')
          s = s.replace(old_ui, new_ui, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ImportApprovalQueue.tsx
          git commit -m 'Show reconstructed time and expected output per product'
          git push
