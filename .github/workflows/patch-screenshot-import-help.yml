name: Patch screenshot import help score
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Inspect employee stage
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/components/ScreenshotImportV2.tsx').read_text()
          for marker in ['const patchEmployee', 'employeeDrafts.map', 'row.ocrName', 'performance', 'availableTime']:
              pos = s.find(marker)
              print('\n###', marker, pos)
              print(s[max(0,pos-800):pos+5000])
          raise SystemExit(1)
