name: Patch screenshot import help score
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Patch import
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/ScreenshotImportV2.tsx')
          s = p.read_text()
          changed = []

          old = 'availableTime: string; confidence: number; include: boolean'
          new = 'availableTime: string; helpScore: string; confidence: number; include: boolean'
          if old not in s: raise SystemExit('EmployeeDraft type target missing')
          s = s.replace(old, new, 1); changed.append('draft type')

          old = 'availableTime: row.available_time == null ? "" : String(row.available_time), confidence:'
          new = 'availableTime: row.available_time == null ? "" : String(row.available_time), helpScore: "0", confidence:'
          if old not in s: raise SystemExit('employee OCR mapping target missing')
          s = s.replace(old, new, 1); changed.append('ocr default')

          # Save the manually entered help score; never use OCR OEE/performance here.
          old = 'help_score: 0, screenshot_path: screenshotPath'
          new = 'help_score: Number(row.helpScore) || 0, screenshot_path: screenshotPath'
          if old not in s: raise SystemExit('daily record help_score target missing')
          s = s.replace(old, new, 1); changed.append('daily record save')

          # At sequence 2 show only the employee, position/assignment and help-score input.
          old = '<div className="grid grid-cols-1 gap-3 sm:grid-cols-3"><div><Label>OEE % (OCR)</Label><Input inputMode="decimal" value={r.oee} onChange={(e) => patchEmployee(r.key, { oee: e.target.value })} placeholder="OCR" /></div><div><Label>Výkon %</Label><Input inputMode="decimal" value={r.performance} onChange={(e) => patchEmployee(r.key, { performance: e.target.value })} placeholder="OCR" /></div><div><Label>Dostupnost %</Label><Input inputMode="decimal" value={r.availableTime} onChange={(e) => patchEmployee(r.key, { availableTime: e.target.value })} placeholder="OCR" /></div></div>'
          new = '<div className="rounded-xl border bg-muted/20 p-3"><Label>Výpomoc — body</Label><Input className="mt-2" inputMode="decimal" type="number" step="0.5" min="-100" max="100" value={r.helpScore} onChange={(e) => patchEmployee(r.key, { helpScore: e.target.value })} placeholder="0" /><div className="mt-1 text-xs text-muted-foreground">Výkon a dostupnost se doplní až ve 3. sekvenci z hodinové tabulky.</div></div>'
          if old not in s: raise SystemExit('employee metrics UI target missing')
          s = s.replace(old, new, 1); changed.append('employee help UI')

          p.write_text(s)
          print('Applied:', ', '.join(changed))
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScreenshotImportV2.tsx .github/workflows/patch-screenshot-import-help.yml
          git rm .github/workflows/patch-screenshot-import-help.yml
          git commit -m 'Add help score input to screenshot import'
          git push origin redesign
