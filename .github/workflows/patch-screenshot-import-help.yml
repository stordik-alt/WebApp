name: Patch screenshot import help score
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Inspect import
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('src/components/ScreenshotImportV2.tsx').read_text()
          print('length=', len(s))
          print('help_score occurrences:')
          for m in re.finditer('help_score', s):
              print(repr(s[max(0,m.start()-250):m.end()+300]))
          print('daily_records context:')
          pos = s.find('daily_records')
          print(repr(s[max(0,pos-300):pos+2200]))
          raise SystemExit(1)
      - name: Never reached
        run: echo diagnostic
