name: Patch zero-output OEE rule

on:
  push:
    branches: [redesign]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign

      - name: Patch OEE calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ocr.hourly.functions.ts')
          s = p.read_text()
          old = 'const weights = effectiveWeights(hourly_metrics.length); let actualOutputTotal = 0; let idealOutputTotal = 0; let weightedOeeTotal = 0; let usedWeight = 0; hourly_metrics.forEach((m, i) => { const weight = weights[i] ?? 1;'
          new = 'const weights = effectiveWeights(hourly_metrics.length); let actualOutputTotal = 0; let idealOutputTotal = 0; let weightedOeeTotal = 0; let usedWeight = 0; hourly_metrics.forEach((m, i) => { const weight = weights[i] ?? 1;'
          if old not in s:
              raise SystemExit('Target calculation block not found')
          target = 'if (m.performance_pct == null || m.availability_pct == null || m.capacity == null || m.capacity <= 0 || data.context.operator_count <= 0) return; const actualOee = m.performance_pct * m.availability_pct * (m.capacity / data.context.operator_count) / 100;'
          replacement = 'if (m.actual_output == null || m.actual_output <= 0) return; if (m.performance_pct == null || m.availability_pct == null || m.capacity == null || m.capacity <= 0 || data.context.operator_count <= 0) return; const actualOee = m.performance_pct * m.availability_pct * (m.capacity / data.context.operator_count) / 100;'
          if target not in s:
              raise SystemExit('Target OEE condition not found')
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ocr.hourly.functions.ts .github/workflows/patch-zero-output-oee.yml
          git commit -m 'Exclude zero-output hours from OEE calculation'
          git push origin HEAD:redesign
          git rm .github/workflows/patch-zero-output-oee.yml
          git commit -m 'Remove temporary OEE patch workflow'
          git push origin HEAD:redesign
