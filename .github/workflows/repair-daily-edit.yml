name: Repair daily record editing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-daily-edit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix daily record editing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/denni-data.tsx')
          s = p.read_text()

          old = '''              <Button
                className="h-12"
                onClick={() => create.mutate("single")}
                disabled={!canSaveOrUpdate || create.isPending}
              >'''
          new = '''              <Button
                className="h-12"
                onClick={() => {
                  if (editingRecord) update.mutate(editingRecord.id);
                  else create.mutate("single");
                }}
                disabled={!canSaveOrUpdate || create.isPending || update.isPending}
              >'''
          if old not in s:
              raise SystemExit('primary save button pattern not found')
          s = s.replace(old, new, 1)

          old = '''              <Button
                variant="secondary"
                className="h-12"
                onClick={() => create.mutate("another")}
                disabled={!canSaveOrUpdate || create.isPending}
              >'''
          new = '''              <Button
                variant="secondary"
                className="h-12"
                onClick={() => {
                  if (editingRecord) update.mutate(editingRecord.id);
                  else create.mutate("another");
                }}
                disabled={!canSaveOrUpdate || create.isPending || update.isPending}
              >'''
          if old not in s:
              raise SystemExit('secondary save button pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/denni-data.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: edit existing daily records instead of duplicating [repair-daily-edit]"
          git push

      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-daily-edit.yml
          git commit -m "chore: remove temporary repair workflow [repair-daily-edit]"
          git push
