name: Subtle Live frame
on:
  push:
    branches: [redesign]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Apply subtle neon frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace(
              'border border-primary/15 bg-[radial-gradient(circle_at_90%_10%,hsl(var(--primary)/0.17),transparent_28%),radial-gradient(circle_at_15%_100%,hsl(var(--chart-4)/0.12),transparent_32%),hsl(var(--card)/0.9)] p-4 shadow-[var(--shadow-card)] backdrop-blur',
              'border border-primary/25 bg-[radial-gradient(circle_at_90%_10%,hsl(var(--primary)/0.14),transparent_28%),radial-gradient(circle_at_15%_100%,hsl(var(--chart-4)/0.09),transparent_32%),hsl(var(--card)/0.92)] p-4 shadow-[0_0_24px_hsl(var(--primary)/0.07),0_0_48px_hsl(var(--chart-4)/0.04),var(--shadow-card)] backdrop-blur ring-1 ring-primary/10'
          )
          s = s.replace(
              'bg-[linear-gradient(90deg,transparent,hsl(var(--primary)/0.75),transparent)]',
              'bg-[linear-gradient(90deg,transparent,hsl(var(--chart-4)/0.45),hsl(var(--primary)/0.55),hsl(var(--chart-3)/0.45),transparent)]'
          )
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git diff --cached --quiet || git commit -m "Refine subtle neon frame"
          git push origin redesign
