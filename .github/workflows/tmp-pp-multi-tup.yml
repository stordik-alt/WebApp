name: Apply shared HA multi-TUP rule
on:
  push:
    branches: ["2.0-AUTO"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0-AUTO
          fetch-depth: 0
      - name: Patch resolver and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/import-v2-auto.ts')
          s = p.read_text()
          old = 'function profileForCode(profiles: ProductProfileContext[], code: string) { const wanted = normalize(code); return profiles.find((p) => normalize(p.ha_subassy) === wanted || normalize(p.tup_subassy) === wanted); }'
          new = '''function profileForCode(profiles: ProductProfileContext[], code: string) {
            const wanted = normalize(code);
            const matches = profiles.filter((p) => normalize(p.ha_subassy) === wanted || normalize(p.tup_subassy) === wanted);
            // A HA subassembly may belong to multiple profiles with different TUP subassemblies.
            // Prefer an exact TUP match; only fall back to HA when it is unambiguous.
            const tupMatch = matches.find((p) => normalize(p.tup_subassy) === wanted);
            if (tupMatch) return tupMatch;
            const haMatches = matches.filter((p) => normalize(p.ha_subassy) === wanted);
            return haMatches.length === 1 ? haMatches[0] : haMatches[0] ?? undefined;
          }'''
          if old not in s:
              raise SystemExit('import-v2-auto.ts resolver pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/productProfiles.ts')
          s = p.read_text()
          old = '  const current = (profiles ?? []).find((profile: ProductProfile) => normalizeCode(profile.ha_subassy) === wantedCode || normalizeCode(profile.tup_subassy) === wantedCode);'
          new = '''  const candidates = (profiles ?? []).filter((profile: ProductProfile) => normalizeCode(profile.ha_subassy) === wantedCode || normalizeCode(profile.tup_subassy) === wantedCode);
  // One HA subassembly can legitimately occur in multiple profiles with different TUP subassemblies.
  // For a TUP product, an exact TUP match is authoritative. HA-only matches are used only when unique.
  const current = candidates.find((profile: ProductProfile) => normalizeCode(profile.tup_subassy) === wantedCode)
    ?? (() => {
      const haMatches = candidates.filter((profile: ProductProfile) => normalizeCode(profile.ha_subassy) === wantedCode);
      return haMatches.length === 1 ? haMatches[0] : haMatches[0];
    })();'''
          if old not in s:
              raise SystemExit('productProfiles.ts resolver pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('supabase/migrations/20260914072000_verze_2_0_auto_recalculated_kpi.sql')
          s = p.read_text()
          old = '''    order by hp.valid_to is null desc, hp.valid_from desc nulls last, hp.version_no desc nulls last
    limit 1;'''
          new = '''    order by
      -- If a code is both a HA and TUP subassembly, prefer the exact TUP side.
      (lower(regexp_replace(coalesce(hp.tup_subassy, ''), '\\s+', '', 'g')) = lower(regexp_replace(coalesce(r.product_code, ''), '\\s+', '', 'g'))) desc,
      hp.valid_to is null desc,
      hp.valid_from desc nulls last,
      hp.version_no desc nulls last
    limit 1;'''
          if old not in s:
              raise SystemExit('recalculated KPI ordering pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/VERZE-2.0-AUTO-DATABAZOVY-KONCEPT.md')
          s = p.read_text()
          marker = '### Product Profile\n'
          addition = '''### Pravidlo sdílené HA podsestavy
- Jedna `ha_subassy` může být použita ve více Product Profilech.
- Tyto profily mohou mít odlišné `tup_subassy`; stejná HA podsestava tedy může být výchozí pro více různých TUP podsestav.
- Identita párování Product Profile není pouze `ha_subassy`; při práci s TUP se musí preferovat přesná shoda `tup_subassy`.
- Výběr profilu nesmí přepsat jeden profil jiným pouze proto, že sdílí stejnou HA podsestavu.
- Pokud je znám pouze HA kód a existuje více kandidátních profilů, systém nesmí předpokládat jinou TUP variantu jako jistou.

'''
          if addition not in s:
              if marker not in s:
                  raise SystemExit('docs marker not found')
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/import-v2-auto.ts src/lib/productProfiles.ts supabase/migrations/20260914072000_verze_2_0_auto_recalculated_kpi.sql docs/VERZE-2.0-AUTO-DATABAZOVY-KONCEPT.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow one HA subassembly in multiple TUP profiles"
          git push origin HEAD:2.0-AUTO
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/tmp-pp-multi-tup.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary patch workflow" || true
          git push origin HEAD:2.0-AUTO || true
