name: Update 2.0 AUTO product summary

on:
  push:
    branches: [Verze-2.0-Auto]
    paths:
      - '.github/workflows/update-product-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Verze-2.0-Auto
          fetch-depth: 1
      - name: Update screenshot import UI and multi-product hourly extraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ScreenshotImportV2.tsx')
          s = p.read_text()
          changed = False

          old_profile = '''      const productCode = result.product_code?.trim() || result.products?.[0]?.product_code?.trim() || "";
      const profile = loadedProfiles.find((p: any) => normalize(p.ha_subassy) === normalize(productCode) || normalize(p.tup_subassy) === normalize(productCode));
      if (profile && finalRows.length && finalMatchedProduct) {
        const hourlyImage = await preprocessOcrImage(dataUrl, { scale: 2, quality: 0.92, maxWidth: 4096, maxHeight: 4096 });
        const role = /^H_/i.test(productCode) ? "HA" : /^T_/i.test(productCode) ? "TUP" : null;
        const hourlyResult = await extractHourly({ data: { imageDataUrl: hourlyImage, context: { profiles: [profile], operator_count: finalRows.length, role } } });
'''
          new_profile = '''      const detectedProductCodes = Array.from(new Set([
        ...(result.products ?? []).map((p: any) => String(p.product_code ?? "").trim()).filter(Boolean),
        ...(result.hourly_metrics ?? []).map((m: any) => String(m.product_code ?? "").trim()).filter(Boolean),
        result.product_code?.trim() || "",
      ].filter(Boolean)));
      const relevantProfiles = loadedProfiles.filter((p: any) => detectedProductCodes.some((code) =>
        normalize(p.ha_subassy) === normalize(code) || normalize(p.tup_subassy) === normalize(code)
      ));
      const missingDetectedProducts = detectedProductCodes.filter((code) =>
        !relevantProfiles.some((p: any) => normalize(p.ha_subassy) === normalize(code) || normalize(p.tup_subassy) === normalize(code))
      );
      if (relevantProfiles.length && finalRows.length && finalMatchedProduct) {
        const hourlyImage = await preprocessOcrImage(dataUrl, { scale: 2, quality: 0.92, maxWidth: 4096, maxHeight: 4096 });
        const roles = new Set(detectedProductCodes.map((code) => /^H_/i.test(code) ? "HA" : /^T_/i.test(code) ? "TUP" : null).filter(Boolean));
        const role = roles.size === 1 ? Array.from(roles)[0] as "HA" | "TUP" : null;
        const hourlyResult = await extractHourly({ data: { imageDataUrl: hourlyImage, context: { profiles: relevantProfiles, operator_count: finalRows.length, role } } });
'''
          if old_profile in s:
              s = s.replace(old_profile, new_profile, 1)
              changed = True

          old_else = '''      } else if (finalRows.length && (!finalMatchedProduct || !profile)) blockers.push(finalMatchedProduct ? "PRODUCT_PROFILE_MISSING" : "PRODUCT_NOT_FOUND");
'''
          new_else = '''      } else if (finalRows.length && (!finalMatchedProduct || !relevantProfiles.length)) blockers.push(finalMatchedProduct ? "PRODUCT_PROFILE_MISSING" : "PRODUCT_NOT_FOUND");
      if (missingDetectedProducts.length) blockers.push("PRODUCT_PROFILE_MISSING");
'''
          if old_else in s:
              s = s.replace(old_else, new_else, 1)
              changed = True

          marker = '''</div> : <div className="text-sm text-muted-foreground">Detail se zobrazí po dokončení OCR.</div>}</div>{selected.status === "PENDING_APPROVAL"'''
          insert = '''</div> : <div className="text-sm text-muted-foreground">Detail se zobrazí po dokončení OCR.</div>}{selected.result && (() => {
            const detected = Array.from(new Set([
              ...(selected.result.products ?? []).map((p: any) => String(p.product_code ?? "").trim()).filter(Boolean),
              ...(selected.result.hourly_metrics ?? []).map((m: any) => String(m.product_code ?? "").trim()).filter(Boolean),
              selected.result.product_code?.trim() || "",
            ].filter(Boolean)));
            const metricsByProduct = detected.map((code) => {
              const rows = (selected.result?.hourly_metrics ?? []).filter((m: any) => normalize(m.product_code) === normalize(code));
              const profile = (selected.result?.products ?? []).find((p: any) => normalize(p.product_code) === normalize(code));
              const weighted = (field: "performance_pct" | "availability_pct" | "actual_oee_pct") => {
                let total = 0, weight = 0;
                for (const row of rows as any[]) { const value = Number(row[field]); const w = Number(row.actual_minutes ?? 0); if (Number.isFinite(value) && w > 0) { total += value * w; weight += w; } }
                return weight > 0 ? total / weight : null;
              };
              const output = rows.reduce((sum: number, row: any) => sum + (Number.isFinite(Number(row.actual_output)) ? Number(row.actual_output) : 0), 0);
              return { code, norm: profile?.norm_per_hour ?? rows.find((r: any) => r.norm_per_hour != null)?.norm_per_hour ?? null, output, performance: weighted("performance_pct"), availability: weighted("availability_pct"), oee: weighted("actual_oee_pct"), hours: rows.length };
            });
            return <div className="mt-4 rounded-xl border border-primary/30 bg-primary/5 p-4"><div className="mb-3 flex items-center justify-between"><div className="font-semibold">Rozpoznané produkty</div><div className="text-xs font-medium text-muted-foreground">{metricsByProduct.length} {metricsByProduct.length === 1 ? "produkt" : metricsByProduct.length < 5 ? "produkty" : "produktů"}</div></div>{metricsByProduct.length ? <div className="space-y-2">{metricsByProduct.map((m) => <div key={m.code} className="rounded-lg border bg-background/70 p-3"><div className="flex flex-wrap items-center justify-between gap-2"><div className="font-semibold break-all">{m.code}</div><div className="text-xs text-muted-foreground">Norma {m.norm != null ? `${m.norm} ks/h` : "—"}</div></div><div className="mt-2 grid grid-cols-2 gap-2 text-xs sm:grid-cols-5"><div><div className="text-muted-foreground">Hodiny</div><div className="font-medium">{m.hours || "—"}</div></div><div><div className="text-muted-foreground">Výstup</div><div className="font-medium">{m.output || "—"}</div></div><div><div className="text-muted-foreground">Výkon</div><div className="font-medium">{m.performance != null ? `${m.performance.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">Dostupnost</div><div className="font-medium">{m.availability != null ? `${m.availability.toFixed(2)} %` : "—"}</div></div><div><div className="text-muted-foreground">OEE</div><div className="font-medium">{m.oee != null ? `${m.oee.toFixed(2)} %` : "—"}</div></div></div></div>)}</div> : <div className="text-sm text-muted-foreground">Produkt zatím nebyl jednoznačně rozpoznán.</div>}</div>;
          })()}</div>{selected.status === "PENDING_APPROVAL"'''
          if marker in s:
              s = s.replace(marker, insert, 1)
              changed = True

          if not changed:
              print('No changes needed')
              raise SystemExit(0)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScreenshotImportV2.tsx
          git diff --cached --quiet || git commit -m 'Show all detected products and extract hourly data per product'
          git push origin HEAD:Verze-2.0-Auto
